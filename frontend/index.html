    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Explorador - Rick y Morty</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body>

        <header class="cabecera">
            <h1>Explorador de Rick y Morty</h1>
            <p>Haz clic en el botón para cargar los personajes</p>
            <button id="btnRick">Cargar Personajes</button>
        </header>

        <main>
            <h2 id="titulo">Bienvenido</h2>

            <div class="buscador">
                <input
                        type="text"
                        id="busqueda"
                        placeholder="Escribe un nombre de personaje..."
                >
                <button id="btnBuscar">Buscar</button>
            </div>

            <div id="resultados"></div>
        </main>

        <script src="app.js"></script>

    </body>
    </html>
