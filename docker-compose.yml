services:
  backend:
    build:
      context: ./backend
    container_name: backend-spring
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - rickmorty-net

  frontend:
    build:
      context: ./frontend
    container_name: frontend-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rickmorty-net

networks:
  rickmorty-net:
    driver: bridge
